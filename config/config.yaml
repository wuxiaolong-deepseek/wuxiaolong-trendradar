# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件(已定制 v3)
#                      TrendRadar v6.10.0
# ═══════════════════════════════════════════════════════════════
#
# 可视化配置编辑器: https://sansan0.github.io/TrendRadar/
#
# 本文件为 v3 定制版,关键变更:
#   - 工作日 1 次推送(cron 1-5,时间由 GitHub Actions 控制)
#   - schedule.enabled = false(本地调度关闭,统一用 cron)
#   - report.mode = incremental(增量模式,周末累积到周一)
#   - platforms:只保留 B 站 + 知乎 2 个热榜平台(关其他 9 个)
#   - RSS:开启 5 个源(机器之心/量子位/HN/PH/GitHub Trending)
#   - 翻译关闭(AI 解读够用,省 token)
#   - AI 模型用环境变量覆盖(智谱 GLM-4-Flash)
#   - ai_analysis.max_news_for_analysis = 12(限制 AI 解读数量)
#


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统(关闭 — 时间由 GitHub Actions cron 控制)
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"


# ===============================================================
# 2. 数据源 - 热榜平台(只保留 B 站 + 知乎,关掉其他 9 个)
# ===============================================================
platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"


# ===============================================================
# 3. 数据源 - RSS 订阅(5 个 AI/GitHub 圈源)
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
    # 中文 AI 圈 — 量子位
    # (机器之家 RSS 因 XML 解析失败 mitched tag 暂时移除,量子位同定位覆盖)
    - id: "qbitai"
      name: "量子位"
      url: "https://www.qbitai.com/feed"
      category: "tech"
    # 海外 AI 圈 — Hacker News
    - id: "hackernews"
      name: "Hacker News"
      url: "https://news.ycombinator.com/rss"
      category: "tech"
    # 海外产品圈 — Product Hunt
    - id: "producthunt"
      name: "Product Hunt"
      url: "https://www.producthunt.com/feed"
      category: "tech"
    # GitHub Trending 周榜
    - id: "github-trending"
      name: "GitHub Trending"
      url: "https://mshibanami.github.io/GitHubTrendingRSS/weekly/all.xml"
      category: "tech"


# ===============================================================
# 4. 报告模式(关键!)
#   incremental = 只推新增,周一时自动汇总 7 天新增
# ===============================================================
report:
  mode: "incremental"             # 增量模式:周一自动汇总 7 天新增
  display_mode: "keyword"         # 按关键词分组显示
  sort_by_position_first: true    # 按 frequency_words.txt 的定义顺序
  rank_threshold: 5
  max_news_per_keyword: 0


# ===============================================================
# 4.5 筛选策略(关键词匹配,不调用 AI 分类)
# ===============================================================
filter:
  method: "keyword"
  priority_sort_enabled: true


# ===============================================================
# 4.6 AI 智能筛选(关键词模式不生效,留默认)
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 推送内容控制
#   只显示关键词匹配的热榜 + AI 解读,其余全部关掉
# ===============================================================
display:
  region_order:
    - hotlist                     # 1. 热榜匹配区域
    - ai_analysis                 # 2. AI 解读区域

  regions:
    hotlist: true                 # 显示关键词匹配的热榜
    new_items: false              # 关闭(已有 hotlist)
    rss: true                     # 开启 RSS 区域
    standalone: false             # 关闭(无需独立展示)
    ai_analysis: true             # 显示 AI 解读

  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20


# ===============================================================
# 6. 推送通知(走 GitHub Secrets,这里留空)
# ===============================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""             # 飞书(本项目未用,改用钉钉)
    dingtalk:
      webhook_url: ""             # 由环境变量 DINGTALK_WEBHOOK_URL 注入
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储配置
#   backend: auto — GitHub Actions + 配了 S3 自动走 remote
#   remote 字段留空,全部从环境变量读取
# ===============================================================
storage:
  backend: "auto"

  formats:
    sqlite: true
    txt: false
    html: true                   # HTML 报告保留(可选点开看)

  local:
    data_dir: "output"
    retention_days: 0

  remote:
    retention_days: 0
    endpoint_url: ""             # 由环境变量 S3_ENDPOINT_URL 注入
    bucket_name: ""              # 由环境变量 S3_BUCKET_NAME 注入
    access_key_id: ""            # 由环境变量 S3_ACCESS_KEY_ID 注入
    secret_access_key: ""        # 由环境变量 S3_SECRET_ACCESS_KEY 注入
    region: ""                   # 由环境变量 S3_REGION 注入

  pull:
    enabled: false
    days: 7


# ===============================================================
# 8. AI 模型配置(由环境变量覆盖,这里留兼容默认值)
# ===============================================================
ai:
  model: "openai/glm-4-flash"      # 智谱 GLM-4-Flash(LiteLLM 格式),实际由 AI_MODEL 环境变量覆盖
  api_key: ""                      # 由环境变量 AI_API_KEY 注入
  api_base: ""                     # 由环境变量 AI_API_BASE 注入
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []


# ===============================================================
# 9. AI 分析功能(总开关 — 由 AI_ANALYSIS_ENABLED 环境变量强制开启)
# ===============================================================
ai_analysis:
  enabled: true                  # GitHub Actions 里 AI_ANALYSIS_ENABLED=true 强制开启
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "incremental"            # 强制 incremental,跟 report.mode 一致
  max_news_for_analysis: 8       # 关键:每天最多 8 条送 AI 解读(简短标签摘要)
  include_rss: true              # 开启 — RSS 内容也要 AI 解读
  include_standalone: false
  include_rank_timeline: true


# ===============================================================
# 10. AI 翻译功能(关闭 — AI 解读够用,省 token)
# ===============================================================
ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: false
    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""

  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1

  max_accounts_per_channel: 3

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
