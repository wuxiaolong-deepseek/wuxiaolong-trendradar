# ═══════════════════════════════════════════════════════════════
#                  TrendRadar 配置文件(v6 - 2026-08-06)
#                      TrendRadar v6.10.0
# ═══════════════════════════════════════════════════════════════
#
# v6 关键变更(从 v5 → v6):
#   - platforms.enabled = false(完全关热榜,只走 RSS)
#   - RSS 改为 4 源(机器之心 / 量子位 / Ben's Bites / Product Hunt)
#   - filter.method = ai(AI 智能筛选,不再靠关键词匹配)
#   - ai_filter.prompt_file 指向 prompt.txt(TrendRadar 默认 AI 筛选 prompt)
#   - 用户偏好单独写在 config/ai_interests.txt
#   - ai_analysis_prompt.txt 重写(边筛边解读 + actionable 标签 + 去重)
#   - 解读数量上限 8(AI 解读区显示),AI 解读总送 20(给 AI 看的原始数)
#   - report.mode = current(每次推当天抓到的全部)
#   - RSS freshness 1 天
#   - frequency_words.txt 简化为只留 GLOBAL_FILTER 兜底
#


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统(关闭 — 时间由 GitHub Actions cron 控制)
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"


# ===============================================================
# 2. 数据源 - 热榜平台(全部关闭,只走 RSS)
# ===============================================================
platforms:
  enabled: false
  api_url: ""
  sources: []


# ===============================================================
# 3. 数据源 - RSS 订阅(4 个 AI/产品/教育 源)
# ===============================================================
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1                # 只取 1 天内的,避免推陈旧内容
  feeds:
    # 中文 AI 圈 — 机器之心
    - id: "jiqizhixin"
      name: "机器之心"
      url: "https://www.jiqizhixin.com/rss"
      category: "tech"
    # 中文 AI 圈 — 量子位
    - id: "qbitai"
      name: "量子位"
      url: "https://www.qbitai.com/feed"
      category: "tech"
    # 海外 AI 工具日报 — Ben's Bites(每日 AI 工具/产品汇总)
    - id: "bensbites"
      name: "Ben's Bites"
      url: "https://www.bensbites.com/feed"
      category: "tech"
    # 海外产品圈 — Product Hunt(新工具发布主战场)
    - id: "producthunt"
      name: "Product Hunt"
      url: "https://www.producthunt.com/feed"
      category: "tech"


# ===============================================================
# 4. 报告模式(关键!)
#   current = 推当前这次抓取里匹配关键词/AI 筛选后的全部
# ===============================================================
report:
  mode: "current"                   # 每次跑都推当天匹配的全部
  display_mode: "keyword"           # 按 actionable 标签分组
  sort_by_position_first: true
  rank_threshold: 5
  max_news_per_keyword: 0


# ===============================================================
# 4.5 筛选策略(关键变更 — 用 AI 智能筛选)
# ===============================================================
filter:
  method: "ai"                      # AI 智能筛选,按 ai_interests.txt 偏好过滤
  priority_sort_enabled: true


# ===============================================================
# 4.6 AI 智能筛选配置
#   prompt_file 指向 TrendRadar 内置的 prompt.txt
#   用户偏好通过 config/ai_interests.txt 注入
# ===============================================================
ai_filter:
  batch_size: 30                    # 一次送 AI 30 条(4 源 × 1 天,够用)
  batch_interval: 2
  min_score: 0.6                    # 评分 ≥ 0.6 才保留(避免噪音)
  reclassify_threshold: 0.5
  prompt_file: "prompt.txt"         # TrendRadar 默认筛选 prompt
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - hotlist                       # 1. 热榜匹配区域(RSS 也走这里)
    - ai_analysis                   # 2. AI 解读区域

  regions:
    hotlist: true                   # 显示筛选后的内容
    new_items: false                # 关闭(已有 hotlist)
    rss: true                       # 开启 RSS 区域
    standalone: false               # 关闭
    ai_analysis: true               # 显示 AI 解读

  standalone:
    platforms: []
    rss_feeds: []
    max_items: 20


# ===============================================================
# 6. 推送通知(走 GitHub Secrets,这里留空)
# ===============================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""               # 飞书(本项目未用,改用钉钉)
    dingtalk:
      webhook_url: ""               # 由环境变量 DINGTALK_WEBHOOK_URL 注入
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"

  formats:
    sqlite: true
    txt: false
    html: true                      # HTML 报告保留(可选点开看)

  local:
    data_dir: "output"
    retention_days: 0

  remote:
    retention_days: 0
    endpoint_url: ""                # 由环境变量 S3_ENDPOINT_URL 注入
    bucket_name: ""                 # 由环境变量 S3_BUCKET_NAME 注入
    access_key_id: ""               # 由环境变量 S3_ACCESS_KEY_ID 注入
    secret_access_key: ""           # 由环境变量 S3_SECRET_ACCESS_KEY 注入
    region: ""                      # 由环境变量 S3_REGION 注入

  pull:
    enabled: false
    days: 7


# ===============================================================
# 8. AI 模型配置(由环境变量覆盖)
# ===============================================================
ai:
  model: "openai/glm-4-flash"       # 智谱 GLM-4-Flash
  api_key: ""                       # 由环境变量 AI_API_KEY 注入
  api_base: ""                      # 由环境变量 AI_API_BASE 注入
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []


# ===============================================================
# 9. AI 分析功能
#   - enabled: true(必须开,后面 AI 解读才工作)
#   - max_news_for_analysis: 20(给 AI 看的原始数)
#   - display_max(自定义): AI 解读区显示 8 条
# ===============================================================
ai_analysis:
  enabled: true                     # GitHub Actions 强制开启
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"   # v2 重写版:边筛边解读 + actionable 标签
  mode: "incremental"               # 跟 report.mode 一致
  max_news_for_analysis: 20         # 给 AI 看 20 条原始
  display_max: 8                    # AI 解读区只显示 8 条
  include_rss: true                 # 开启 — RSS 内容也要 AI 解读
  include_standalone: false
  include_rank_timeline: true


# ===============================================================
# 10. AI 翻译功能(关闭 — AI 解读够用,省 token)
# ===============================================================
ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: false
    standalone: false


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""

  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1

  max_accounts_per_channel: 3

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
